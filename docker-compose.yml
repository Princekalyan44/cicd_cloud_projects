# Docker Compose Configuration for Portfolio Application
# Orchestrates frontend, chatbot, and database services

services:
  # ============================================
  # PostgreSQL Database with pgvector
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: portfolio-postgres
    
    # Port mapping (optional - for direct access)
    ports:
      - "5433:5432"  # Using 5433 to avoid conflict with host PostgreSQL
    
    # Environment variables
    environment:
      - POSTGRES_USER=dbadmin
      - POSTGRES_PASSWORD=dbpassword
      - POSTGRES_DB=portfolio
    
    # Volume for data persistence
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    # Restart policy
    restart: unless-stopped
    
    # Connect to custom network
    networks:
      - portfolio-network

  # ============================================
  # Frontend Service - Next.js Portfolio
  # ============================================
  portfolio-frontend:
    image: kalyanace44/portfolio-frontend:v1
    container_name: portfolio-frontend
    
    # Build configuration (if building from source)
    build:
      context: ./portfolio-frontend
      dockerfile: Dockerfile
    
    # Port mapping
    ports:
      - "3000:3000"
    
    # Environment variables
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Chatbot API URL (internal service name)
      - CHATBOT_API_URL=http://chatbot-service:8080
    
    # Depends on chatbot service
    depends_on:
      chatbot-service:
        condition: service_started
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    
    # Restart policy
    restart: unless-stopped
    
    # Connect to custom network
    networks:
      - portfolio-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # Chatbot Service - AI Backend
  # ============================================
  chatbot-service:
    image: kalyanace44/portfolio-chatbot:v1
    container_name: portfolio-chatbot
    
    # Build configuration (if building from source)
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    
    # Port mapping (internal only, not exposed to host)
    expose:
      - "8080"
    
    # Optional: Expose to host for testing
    # ports:
    #   - "8080:8080"
    
    # Environment variables (matching entrypoint.sh expectations)
    environment:
      - ENVIRONMENT=production
      - PORT=8080
      - LOG_LEVEL=info
      # Database connection (matching entrypoint.sh variable names)
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=dbadmin
      - DB_PASSWORD=dbpassword
      - DB_NAME=portfolio
      # Also provide DATABASE_URL for app usage
      - DATABASE_URL=postgresql://dbadmin:dbpassword@postgres:5432/portfolio
      # Add OpenAI API key or other AI service credentials if needed
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
    
    # Depends on database
    depends_on:
      postgres:
        condition: service_healthy
    
    # Health check - wait longer for initialization
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s  # Longer start period for DB initialization
      retries: 5
    
    # Restart policy
    restart: unless-stopped
    
    # Connect to custom network
    networks:
      - portfolio-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Volume for knowledge base data
    volumes:
      - ./chatbot-service/data:/app/data:ro

# ============================================
# Networks
# ============================================
networks:
  portfolio-network:
    driver: bridge
    name: portfolio-network

# ============================================
# Volumes for data persistence
# ============================================
volumes:
  postgres-data:
    driver: local
    name: portfolio-postgres-data
