# Development Resource Limit Patches
# Lower resource requests for dev environment

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-chatbot
spec:
  template:
    spec:
      containers:
        - name: chatbot
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
