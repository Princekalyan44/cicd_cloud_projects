# Development Replica Count Patches
# Reduce replicas for cost savings in dev

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-frontend
spec:
  replicas: 1  # Single replica in dev

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-chatbot
spec:
  replicas: 1

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  replicas: 1
