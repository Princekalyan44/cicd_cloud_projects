# PostgreSQL Credentials Secret
# IMPORTANT: This is a template - use Vault or AWS Secrets Manager in production
# For now, base64 encode your credentials

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: portfolio-prod
  labels:
    app: postgres
  annotations:
    description: "PostgreSQL database credentials - REPLACE WITH VAULT"
type: Opaque
data:
  # Base64 encoded values
  # To encode: echo -n 'your-value' | base64
  # To decode: echo 'encoded-value' | base64 -d
  
  username: cG9zdGdyZXM=  # postgres
  password: Y2hhbmdlbWUtaW4tcHJvZHVjdGlvbiE=  # changeme-in-production!
  
  # Full connection string
  connection-string: cG9zdGdyZXNxbDovL3Bvc3RncmVzOmNoYW5nZW1lLWluLXByb2R1Y3Rpb24hQHBvc3RncmVzOjU0MzIvcG9ydGZvbGlv
  # postgresql://postgres:changeme-in-production!@postgres:5432/portfolio

