# Chatbot Service Deployment
# AI-powered chatbot with RAG (Retrieval Augmented Generation)
# Connects to PostgreSQL for knowledge base and conversation history

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-chatbot
  namespace: portfolio-prod
  labels:
    app: portfolio-chatbot
    component: application
    tier: backend
spec:
  replicas: 2
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  
  selector:
    matchLabels:
      app: portfolio-chatbot
  
  template:
    metadata:
      labels:
        app: portfolio-chatbot
        component: application
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: portfolio-chatbot
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # Anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - portfolio-chatbot
                topologyKey: kubernetes.io/hostname
      
      # Init container to wait for PostgreSQL
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      
      containers:
        - name: chatbot
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/portfolio-chatbot:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          env:
            # Database connection
            - name: DB_HOST
              value: "postgres"
            
            - name: DB_PORT
              value: "5432"
            
            - name: DB_NAME
              value: "portfolio"
            
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            
            # Application settings
            - name: PORT
              value: "8080"
            
            - name: LOG_LEVEL
              value: "info"
            
            # Model settings
            - name: MODEL_NAME
              value: "sentence-transformers/all-MiniLM-L6-v2"
            
            - name: MAX_TOKENS
              value: "500"
            
            - name: TEMPERATURE
              value: "0.7"
          
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # 5 minutes for model loading
          
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          
          # Volume mounts for model cache
          volumeMounts:
            - name: model-cache
              mountPath: /app/models
      
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 2Gi  # Cache for ML models
      
      terminationGracePeriodSeconds: 60  # More time for ongoing requests
