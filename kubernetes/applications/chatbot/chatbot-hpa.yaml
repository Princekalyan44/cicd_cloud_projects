# Horizontal Pod Autoscaler for Chatbot
# Automatically scales based on CPU and memory usage

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chatbot-hpa
  namespace: portfolio-prod
  labels:
    app: chatbot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chatbot
  
  minReplicas: 2   # Minimum for HA
  maxReplicas: 5   # Maximum to control costs
  
  # Scaling behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
        - type: Percent
          value: 50  # Scale down max 50% of pods at a time
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 1 minute before scaling up
      policies:
        - type: Percent
          value: 100  # Can double pods quickly
          periodSeconds: 60
        - type: Pods
          value: 2  # Or add 2 pods at a time
          periodSeconds: 60
      selectPolicy: Max  # Use whichever policy scales faster
  
  # Metrics to scale on
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80  # Scale when CPU > 80%
    
    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85  # Scale when memory > 85%
