# PostgreSQL Services
# Two services: regular service for connections, headless for StatefulSet

---
# Regular service for database connections
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: portfolio-prod
  labels:
    app: postgres
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # Use NLB if external
spec:
  type: ClusterIP  # Internal only
  sessionAffinity: ClientIP  # Sticky sessions
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
    - name: metrics
      port: 9187
      targetPort: 9187
      protocol: TCP
  selector:
    app: postgres

---
# Headless service for StatefulSet
# Provides stable DNS names for each pod
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: portfolio-prod
  labels:
    app: postgres
spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: postgres
  # This creates DNS: postgres-0.postgres-headless.portfolio-prod.svc.cluster.local
