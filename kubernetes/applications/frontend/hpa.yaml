# Horizontal Pod Autoscaler for Frontend
# Automatically scale pods based on CPU and memory usage

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portfolio-frontend-hpa
  namespace: portfolio-prod
  labels:
    app: portfolio-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portfolio-frontend
  
  # Replica bounds
  minReplicas: 2   # Minimum for high availability
  maxReplicas: 10  # Maximum based on traffic
  
  # Scaling behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
      policies:
        - type: Percent
          value: 50  # Scale down max 50% of pods at a time
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 1 min before scaling up
      policies:
        - type: Percent
          value: 100  # Scale up max 100% of pods at a time
          periodSeconds: 30
        - type: Pods
          value: 2  # Or add 2 pods at a time
          periodSeconds: 30
      selectPolicy: Max  # Use the policy that scales faster
  
  # Metrics to scale on
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # Scale when avg CPU > 70%
    
    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80  # Scale when avg memory > 80%
