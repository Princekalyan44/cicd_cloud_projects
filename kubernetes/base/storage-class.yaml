# Storage Classes
# Define storage types for persistent volumes
# Using AWS EBS CSI driver (installed via Terraform)

---
# General purpose SSD (gp3) - Default
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "3000"           # IOPS for gp3 volumes
  throughput: "125"      # Throughput in MB/s
  encrypted: "true"      # Enable encryption at rest
  kmsKeyId: ""           # Use default AWS managed key
volumeBindingMode: WaitForFirstConsumer  # Ensure volume is in same AZ as pod
allowVolumeExpansion: true  # Allow resizing volumes
reclaimPolicy: Delete       # Delete volume when PVC is deleted

---
# High performance SSD (io2) - For databases
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: io2
provisioner: ebs.csi.aws.com
parameters:
  type: io2
  iops: "10000"         # High IOPS for database workloads
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain      # Retain volume even after PVC deletion (safety)

---
# Throughput optimized (st1) - For logs and large sequential data
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: st1
provisioner: ebs.csi.aws.com
parameters:
  type: st1
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
