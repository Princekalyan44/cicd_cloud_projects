# Secrets Template
# These are managed by HashiCorp Vault in production
# This file shows the structure for reference
# DO NOT commit actual secrets to git!

---
# PostgreSQL Secret (managed by Vault)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: portfolio-prod
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "postgres"
    vault.hashicorp.com/agent-inject-secret-password: "secret/data/portfolio/postgres"
type: Opaque
stringData:
  # These will be injected by Vault
  password: "CHANGEME"

---
# Chatbot Secret (managed by Vault)
apiVersion: v1
kind: Secret
metadata:
  name: chatbot-secret
  namespace: portfolio-prod
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "chatbot"
    vault.hashicorp.com/agent-inject-secret-db-password: "secret/data/portfolio/postgres"
    vault.hashicorp.com/agent-inject-secret-openai-api-key: "secret/data/portfolio/openai"
    vault.hashicorp.com/agent-inject-secret-secret-key: "secret/data/portfolio/chatbot"
type: Opaque
stringData:
  db-password: "CHANGEME"
  openai-api-key: "CHANGEME"
  secret-key: "CHANGEME"

---
# TLS Certificate Secret (if not using ACM)
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: portfolio-prod
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  tls.crt: LS0tLS1CRUdJTi...
  tls.key: LS0tLS1CRUdJTi...
