# Resource Quotas
# Limit resource consumption per namespace
# Prevents resource exhaustion and ensures fair sharing

---
# Development environment quotas (generous for testing)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: portfolio-dev
spec:
  hard:
    # Compute resources
    requests.cpu: "4"          # Total CPU requests
    requests.memory: 8Gi       # Total memory requests
    limits.cpu: "8"            # Total CPU limits
    limits.memory: 16Gi        # Total memory limits
    
    # Storage
    requests.storage: 50Gi     # Total storage requests
    persistentvolumeclaims: "5"  # Max number of PVCs
    
    # Object counts
    pods: "20"                 # Max number of pods
    services: "10"             # Max number of services
    configmaps: "20"           # Max number of configmaps
    secrets: "20"              # Max number of secrets
    services.loadbalancers: "2"  # Max load balancers

---
# Staging environment quotas (moderate)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: portfolio-staging
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "12"
    limits.memory: 24Gi
    requests.storage: 100Gi
    persistentvolumeclaims: "10"
    pods: "30"
    services: "15"
    configmaps: "30"
    secrets: "30"
    services.loadbalancers: "2"

---
# Production environment quotas (higher limits)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-quota
  namespace: portfolio-prod
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    requests.storage: 200Gi
    persistentvolumeclaims: "15"
    pods: "50"
    services: "20"
    configmaps: "40"
    secrets: "40"
    services.loadbalancers: "3"

---
# Monitoring namespace quotas
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    requests.storage: 500Gi    # Large storage for metrics/logs
    persistentvolumeclaims: "10"
    pods: "30"
