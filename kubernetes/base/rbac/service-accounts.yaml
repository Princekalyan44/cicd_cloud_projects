# Service Accounts
# Kubernetes identities for applications and services
# Used for RBAC and IAM role association (IRSA)

---
# Frontend Application Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio-frontend
  namespace: portfolio-prod
  labels:
    app: portfolio-frontend
    component: application
  annotations:
    # IRSA - Associate with AWS IAM role for access to AWS services
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/portfolio-frontend-role
    description: "Service account for portfolio frontend application"

---
# Chatbot Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio-chatbot
  namespace: portfolio-prod
  labels:
    app: portfolio-chatbot
    component: application
  annotations:
    # IRSA - Needs access to RDS and potentially S3
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/portfolio-chatbot-role
    description: "Service account for chatbot service with RDS access"

---
# LLM Log Analyzer Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-log-analyzer
  namespace: portfolio-prod
  labels:
    app: llm-log-analyzer
    component: ml
  annotations:
    # IRSA - Needs access to CloudWatch Logs and S3
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/llm-log-analyzer-role
    description: "Service account for LLM log analyzer"

---
# ArgoCD Service Account (for cluster-wide access)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-application-controller
  namespace: argocd
  labels:
    app: argocd
    component: gitops
  annotations:
    description: "Service account for ArgoCD application controller"

---
# Monitoring Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    component: monitoring
  annotations:
    description: "Service account for Prometheus monitoring"

---
# Vault Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
    component: secrets-management
  annotations:
    # IRSA - Needs access to KMS for auto-unseal
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/vault-kms-unseal
    description: "Service account for HashiCorp Vault"
